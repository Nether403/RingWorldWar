name: Headless qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-qualification-t480s
  cancel-in-progress: false

jobs:
  requirement-17-5:
    name: Requirement 17.5
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64, t480s-headless-01]
    environment: headless-qualification
    timeout-minutes: 25
    env:
      RWW_PINNED_RUNNER_ID: t480s-headless-01
      RWW_RUNNER_DEDICATED: "1"
      RWW_RUNNER_IMMUTABLE_WORKSPACE: "1"
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize and verify clean checkout
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git reset --hard HEAD
          git clean -ffdx
          $changes = git status --porcelain=v1
          if ($LASTEXITCODE -ne 0 -or $changes) {
            throw "Qualification checkout is not clean: $changes"
          }

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify AC power and fixed performance plan
        shell: pwsh
        run: |
          $battery = @(Get-CimInstance Win32_Battery -ErrorAction Stop)
          if ($battery.Count -eq 0) {
            throw "Qualification runner battery telemetry is unavailable"
          }
          $acStatuses = @(2, 3, 6, 7, 8, 9, 11)
          if (@($battery | Where-Object { $_.BatteryStatus -notin $acStatuses }).Count -gt 0) {
            throw "Qualification runner is not on AC power: $($battery.BatteryStatus -join ',')"
          }
          $powerPlan = powercfg /GETACTIVESCHEME
          $highPerformanceGuid = "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"
          if ($LASTEXITCODE -ne 0 -or $powerPlan -notmatch $highPerformanceGuid) {
            throw "Qualification runner is not using a fixed high-performance power plan: $powerPlan"
          }
          "RWW_RUNNER_AC_POWER=1" | Add-Content -Path $env:GITHUB_ENV
          "RWW_RUNNER_POWER_POLICY=fixed-performance" | Add-Content -Path $env:GITHUB_ENV

      - name: Qualify canonical headless simulation
        run: npm run rww -- perf headless-40m --qualify

      - name: Upload qualification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: headless-qualification-${{ github.run_id }}
          path: output/runs/
          if-no-files-found: error
          retention-days: 30
